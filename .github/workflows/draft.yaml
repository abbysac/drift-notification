name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout notification repository
      # =========================================================
      - name: Checkout notification repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Checkout infrastructure repository
      # =========================================================
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: abbysac/drift-detection
          ref: main
          path: infrastructure

      # =========================================================
      # 3. Find Terraform configuration and state
      # =========================================================
      - name: Locate Terraform files and state
        run: |
          echo "=========================================="
          echo "INFRASTRUCTURE REPOSITORY"
          echo "=========================================="

          echo ""
          echo "Repository contents:"
          find "$GITHUB_WORKSPACE/infrastructure" \
            -maxdepth 3 \
            -type f \
            -print

          echo ""
          echo "=========================================="
          echo "SEARCHING FOR TERRAFORM STATE"
          echo "=========================================="

          STATE_COUNT=$(find "$GITHUB_WORKSPACE/infrastructure" \
            -name "terraform.tfstate" \
            -type f | wc -l)

          echo "State files found: $STATE_COUNT"

          if [ "$STATE_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No terraform.tfstate file was found."
            echo ""
            echo "This means the state file is not present in the"
            echo "checked-out infrastructure repository."
            exit 1
          fi

          echo ""
          echo "State file(s) found:"
          find "$GITHUB_WORKSPACE/infrastructure" \
            -name "terraform.tfstate" \
            -type f \
            -print

      # =========================================================
      # 4. Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # =========================================================
      # 5. Configure AWS credentials
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      # =========================================================
      # 6. Verify AWS credentials
      # =========================================================
      - name: Verify AWS identity
        run: |
          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # =========================================================
      # 7. Verify Terraform directory
      # =========================================================
      - name: Verify Terraform directory
        run: |
          echo "=========================================="
          echo "TERRAFORM DIRECTORY"
          echo "=========================================="

          echo ""
          echo "Contents of infrastructure/terraform:"
          ls -la "$GITHUB_WORKSPACE/infrastructure/terraform"

          echo ""
          echo "Terraform files:"
          find "$GITHUB_WORKSPACE/infrastructure/terraform" \
            -maxdepth 2 \
            -type f \
            -print

      # =========================================================
      # 8. Terraform Init
      # =========================================================
      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: |
          echo "=========================================="
          echo "TERRAFORM INIT"
          echo "=========================================="

          terraform init -input=false

      # =========================================================
      # 9. Locate state AFTER terraform init
      # =========================================================
      - name: Verify Terraform state after init
        working-directory: ./infrastructure/terraform
        run: |
          echo "=========================================="
          echo "TERRAFORM STATE AFTER INIT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform directory contents:"
          ls -lah

          echo ""
          echo "Terraform state files:"
          find . \
            -name "terraform.tfstate" \
            -type f \
            -print

          echo ""
          echo "Terraform state backup files:"
          find . \
            -name "terraform.tfstate.backup" \
            -type f \
            -print

          echo ""
          echo "Terraform directory:"
          ls -lah .terraform || true

      # =========================================================
      # 10. Display Terraform state using explicit state path
      # =========================================================
      - name: Display Terraform state
        working-directory: ./infrastructure/terraform
        run: |
          echo "=========================================="
          echo "TERRAFORM STATE"
          echo "=========================================="

          STATE_FILE="$GITHUB_WORKSPACE/infrastructure/terraform/terraform.tfstate"

          echo ""
          echo "Expected state file:"
          echo "$STATE_FILE"

          if [ ! -f "$STATE_FILE" ]; then
            echo ""
            echo "ERROR: State file does not exist:"
            echo "$STATE_FILE"

            echo ""
            echo "Searching for state files:"
            find "$GITHUB_WORKSPACE/infrastructure" \
              -name "terraform.tfstate" \
              -type f \
              -print

            exit 1
          fi

          echo ""
          echo "State file found:"
          ls -lh "$STATE_FILE"

          echo ""
          echo "Resources currently in Terraform state:"
          echo "------------------------------------------"

          terraform state list \
            -state="$STATE_FILE"

      # =========================================================
      # 11. Terraform Plan / Drift Check
      # =========================================================
      - name: Terraform Drift Check
        id: plan
        working-directory: ./infrastructure/terraform
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "RUNNING TERRAFORM PLAN"
          echo "=========================================="

          terraform plan \
            -detailed-exitcode \
            -no-color \
            -state="$GITHUB_WORKSPACE/infrastructure/terraform/terraform.tfstate" \
            > drift-plan.txt 2>&1

          TERRAFORM_EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "TERRAFORM PLAN OUTPUT"
          echo "=========================================="

          cat drift-plan.txt

          echo ""
          echo "Terraform raw exit code: $TERRAFORM_EXIT_CODE"

          # =======================================================
          # Detect actual Terraform changes from Plan summary
          # =======================================================

          if grep -Eq \
            'Plan: [1-9][0-9]* to add, [0-9]+ to change, [0-9]+ to destroy\.|Plan: [0-9]+ to add, [1-9][0-9]* to change, [0-9]+ to destroy\.|Plan: [0-9]+ to add, [0-9]+ to change, [1-9][0-9]* to destroy\.' \
            drift-plan.txt; then

            echo ""
            echo "DRIFT DETECTED"

            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"

          elif [ "$TERRAFORM_EXIT_CODE" -eq 1 ]; then

            echo ""
            echo "TERRAFORM ERROR"

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"

            exit 1

          else

            echo ""
            echo "NO DRIFT DETECTED"

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"

          fi

          echo ""
          echo "=========================================="
          echo "FINAL DRIFT STATUS"
          echo "=========================================="

          echo "Terraform raw exit code: $TERRAFORM_EXIT_CODE"

          if grep -q "drift_detected=true" "$GITHUB_OUTPUT"; then
            echo "Drift detected: true"
          else
            echo "Drift detected: false"
          fi

      # =========================================================
      # 12. Display detected drift
      # =========================================================
      - name: Display detected drift
        if: steps.plan.outputs.drift_detected == 'true'
        run: |
          echo "=========================================="
          echo "AWS DRIFT DETECTED"
          echo "=========================================="

          echo ""
          echo "Changed resources:"
          grep -E '^  # .* will be ' \
            "$GITHUB_WORKSPACE/infrastructure/terraform/drift-plan.txt" \
            || true

          echo ""
          echo "Terraform summary:"
          grep -E '^Plan:' \
            "$GITHUB_WORKSPACE/infrastructure/terraform/drift-plan.txt" \
            || true

          echo ""
          echo "Full Terraform plan:"
          cat "$GITHUB_WORKSPACE/infrastructure/terraform/drift-plan.txt"

      # =========================================================
      # 13. Upload Terraform drift plan
      # =========================================================
      - name: Upload Terraform drift plan
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-plan
          path: infrastructure/terraform/drift-plan.txt

      # =========================================================
      # 14. Prepare SES email
      # =========================================================
      - name: Prepare SES email
        if: steps.plan.outputs.drift_detected == 'true'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          plan_file = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "infrastructure"
              / "terraform"
              / "drift-plan.txt"
          )

          if not plan_file.exists():
              raise SystemExit(
                  f"ERROR: {plan_file} was not found"
              )

          plan = plan_file.read_text()

          changed_resources = []

          for line in plan.splitlines():
              stripped = line.strip()

              if stripped.startswith("# ") and " will be " in stripped:
                  changed_resources.append(stripped[2:])

          if changed_resources:
              resource_summary = "\n".join(
                  f"- {resource}"
                  for resource in changed_resources
              )
          else:
              resource_summary = (
                  "- Terraform detected infrastructure changes."
              )

          body = f"""Terraform Drift Detected

          Terraform has detected changes in your AWS infrastructure.

          Changed Resource(s)
          ===================

          {resource_summary}

          Terraform Plan
          ===============

          {plan}

          ===============================

          Please review the Terraform plan and determine whether
          these infrastructure changes were intentional.
          """

          request = {
              "Source": os.environ["SES_FROM"],
              "Destination": {
                  "ToAddresses": [
                      os.environ["SES_TO"]
                  ]
              },
              "Message": {
                  "Subject": {
                      "Data": "Terraform Drift Detected",
                      "Charset": "UTF-8"
                  },
                  "Body": {
                      "Text": {
                          "Data": body,
                          "Charset": "UTF-8"
                      }
                  }
              }
          }

          request_file = Path("/tmp/ses-request.json")

          request_file.write_text(
              json.dumps(request, indent=2)
          )

          print("SES request prepared successfully.")
          print(f"Plan size: {len(plan)} characters")

          print("")
          print("Changed resources:")

          for resource in changed_resources:
              print(resource)

          print("")
          print(f"SES request file: {request_file}")
          PY

      # =========================================================
      # 15. Send SES drift notification
      # =========================================================
      - name: Send SES drift notification
        if: steps.plan.outputs.drift_detected == 'true'
        run: |
          echo "=========================================="
          echo "SENDING SES DRIFT EMAIL"
          echo "=========================================="

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo ""
          echo "=========================================="
          echo "SES EMAIL SENT SUCCESSFULLY"
          echo "=========================================="

      # =========================================================
      # 16. No drift
      # =========================================================
      - name: No drift detected
        if: steps.plan.outputs.drift_detected == 'false' && steps.plan.outputs.exit_code == '0'
        run: |
          echo "=========================================="
          echo "NO DRIFT DETECTED"
          echo "=========================================="

          echo ""
          echo "Terraform configuration matches AWS infrastructure."

      # =========================================================
      # 17. Terraform error
      # =========================================================
      - name: Terraform plan failed
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "=========================================="
          echo "TERRAFORM PLAN FAILED"
          echo "=========================================="

          cat "$GITHUB_WORKSPACE/infrastructure/terraform/drift-plan.txt"

          exit 1