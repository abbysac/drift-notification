name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    # Run every day at 8:00 AM UTC
     - cron: "0 */6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout this notification repository
      # =========================================================
      - name: Checkout drift notification repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Checkout the PUBLIC infrastructure repository
      # =========================================================
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: abbysac/drift-detection
          ref: main
          path: terraform

      # =========================================================
      # 3. Verify that Terraform configuration exists
      # =========================================================
      - name: Verify Terraform configuration
        run: |
          echo "========================================"
          echo "Current directory"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "Infrastructure repository contents"
          echo "========================================"
          ls -la terraform

          echo ""
          echo "========================================"
          echo "Terraform files"
          echo "========================================"

          find terraform -type f -name "*.tf" -print

          echo ""
          echo "========================================"
          echo "Checking for Terraform configuration"
          echo "========================================"

          TF_COUNT=$(find terraform -type f -name "*.tf" | wc -l)

          echo "Terraform files found: $TF_COUNT"

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files were found."
            echo ""
            echo "The infrastructure repository was checked out, but"
            echo "Terraform configuration could not be located."
            exit 1
          fi

          echo ""
          echo "Terraform configuration found successfully."

      # =========================================================
      # 4. Configure AWS credentials using GitHub OIDC
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # =========================================================
      # 5. Verify AWS credentials
      # =========================================================
      - name: Verify AWS identity
        run: |
          echo "AWS credentials successfully configured."
          echo ""
          aws sts get-caller-identity

      # =========================================================
      # 6. Install Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================================================
      # 7. Terraform Init
      # =========================================================
      - name: Terraform Init
        working-directory: abbysac/drift-notification
        run: |
          terraform init -input=false

      # =========================================================
      # 8. Terraform Plan / Drift Detection
      # =========================================================
      - name: Terraform Plan
        id: drift
        working-directory: abbysac/drift-notification
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Running Terraform Plan"
          echo "========================================"

          terraform plan \
            -detailed-exitcode \
            -no-color \
            > drift-plan.txt 2>&1

          PLAN_EXIT_CODE=$?

          echo ""
          echo "Terraform exit code: $PLAN_EXIT_CODE"
          echo ""

          echo "exit_code=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Terraform Plan Output"
          echo "========================================"

          cat drift-plan.txt

          echo ""
          echo "========================================"

          # -------------------------------------------------------
          # Exit code 1 = Terraform error
          # -------------------------------------------------------
          if [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Terraform plan failed."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # -------------------------------------------------------
          # Exit code 2 = Terraform detected changes
          # -------------------------------------------------------
          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform drift detected."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -------------------------------------------------------
          # Exit code 0 normally means no changes.
          # Check Plan summary as an additional safeguard.
          # -------------------------------------------------------
          if grep -Eq '^Plan: [1-9][0-9]* to add,|^Plan: [0-9]+ to change, [1-9][0-9]* to destroy|^Plan: [0-9]+ to add, [1-9][0-9]* to change' drift-plan.txt; then
            echo "Terraform plan contains changes."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No Terraform drift detected."
          echo "drift_detected=false" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 9. Display detected drift
      # =========================================================
      - name: Display detected drift
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "========================================"
          echo "TERRAFORM DRIFT DETECTED"
          echo "========================================"

          echo ""
          echo "Changed resources:"
          echo "----------------------------------------"

          grep -E '^  # .* will be ' terraform/drift-plan.txt || true

          echo ""
          echo "Terraform Plan Summary:"
          echo "----------------------------------------"

          grep -E '^Plan:' terraform/drift-plan.txt || true

          echo ""
          echo "Full Terraform Plan:"
          echo "----------------------------------------"

          cat terraform/drift-plan.txt

      # =========================================================
      # 10. Upload Terraform plan
      # =========================================================
      - name: Upload Terraform drift plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-plan
          path: terraform/drift-plan.txt
          if-no-files-found: warn

      # =========================================================
      # 11. Prepare SES email
      # =========================================================
      - name: Prepare SES email
        if: steps.drift.outputs.drift_detected == 'true'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          echo "========================================"
          echo "Preparing SES email"
          echo "========================================"

          python3 <<'PY'
          import json
          import os

          drift_file = "terraform/drift-plan.txt"

          with open(drift_file, "r") as f:
              plan = f.read()

          request = {
              "Source": os.environ["SES_FROM"],
              "Destination": {
                  "ToAddresses": [
                      os.environ["SES_TO"]
                  ]
              },
              "Message": {
                  "Subject": {
                      "Data": "Terraform Drift Detected"
                  },
                  "Body": {
                      "Text": {
                          "Data": (
                              "Terraform has detected drift in your AWS infrastructure.\n\n"
                              "========================================\n"
                              "Terraform Drift Details\n"
                              "========================================\n\n"
                              + plan
                              + "\n\n"
                              "The complete Terraform plan is also available "
                              "as an artifact in this GitHub Actions run."
                          )
                      }
                  }
              }
          }

          with open("/tmp/ses-request.json", "w") as f:
              json.dump(request, f, indent=2)

          print("SES request written to /tmp/ses-request.json successfully.")
          print("SES request:")
          print(json.dumps(request, indent=2))
          PY

      # =========================================================
      # 12. Send SES email
      # =========================================================
      - name: Send SES drift notification
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "========================================"
          echo "Sending SES drift notification"
          echo "========================================"

          echo ""
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Sending email..."

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo ""
          echo "========================================"
          echo "SES EMAIL SENT SUCCESSFULLY"
          echo "========================================"

      # =========================================================
      # 13. No drift
      # =========================================================
      - name: No drift detected
        if: steps.drift.outputs.drift_detected == 'false'
        run: |
          echo "========================================"
          echo "NO TERRAFORM DRIFT DETECTED"
          echo "========================================"

          echo "No SES notification was sent."

      # =========================================================
      # 14. Terraform failure
      # =========================================================
      - name: Terraform plan failed
        if: failure() && steps.drift.outputs.exit_code == '1'
        run: |
          echo "========================================"
          echo "TERRAFORM PLAN FAILED"
          echo "========================================"

          echo "Check the Terraform Plan step above for details."
