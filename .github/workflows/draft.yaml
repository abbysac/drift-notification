name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout drift-notification repository
      # ============================================================
      - name: Checkout drift notification repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Checkout PUBLIC drift-detection repository
      # ============================================================
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: abbysac/drift-detection
          ref: main
          path: infrastructure

      # ============================================================
      # 3. Show exactly what was checked out
      # ============================================================
      - name: Inspect infrastructure repository
        shell: bash
        run: |
          echo "=================================================="
          echo "CURRENT WORKING DIRECTORY"
          echo "=================================================="
          pwd

          echo ""
          echo "=================================================="
          echo "INFRASTRUCTURE REPOSITORY"
          echo "=================================================="

          find infrastructure -maxdepth 4 -type f -print | sort

          echo ""
          echo "=================================================="
          echo "TERRAFORM FILES"
          echo "=================================================="

          find infrastructure -type f -name "*.tf" -print | sort

      # ============================================================
      # 4. Locate Terraform configuration
      # ============================================================
      - name: Locate Terraform directory
        id: terraform-location
        shell: bash
        run: |

          echo "=================================================="
          echo "SEARCHING FOR TERRAFORM CONFIGURATION"
          echo "=================================================="

          TF_FILES=$(find infrastructure -type f -name "*.tf" -print)

          if [ -z "$TF_FILES" ]; then

            echo ""
            echo "ERROR: No Terraform configuration files found."
            echo ""

            echo "Files that were checked out:"
            find infrastructure -type f -print | sort

            echo ""
            echo "Make sure the main branch of"
            echo "abbysac/drift-detection"
            echo "contains Terraform .tf files."

            exit 1
          fi

          echo "Terraform files found:"
          echo "$TF_FILES"

          echo ""
          echo "=================================================="
          echo "DETERMINING TERRAFORM DIRECTORY"
          echo "=================================================="

          # Find the directory containing main.tf.
          MAIN_TF=$(find infrastructure -type f -name "main.tf" -print | head -n 1)

          if [ -n "$MAIN_TF" ]; then

            TF_DIR=$(dirname "$MAIN_TF")

          else

            # If there is no main.tf, use the directory
            # containing the first .tf file.
            FIRST_TF=$(echo "$TF_FILES" | head -n 1)

            TF_DIR=$(dirname "$FIRST_TF")

          fi

          echo "Terraform configuration:"
          echo "$TF_DIR"

          echo ""
          echo "Terraform files in this directory:"
          find "$TF_DIR" -maxdepth 1 -type f -name "*.tf" -print | sort

          echo ""

          echo "terraform_dir=$TF_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Configure AWS using GitHub OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # ============================================================
      # 6. Verify AWS identity
      # ============================================================
      - name: Verify AWS identity
        run: |

          echo "=================================================="
          echo "AWS IDENTITY"
          echo "=================================================="

          aws sts get-caller-identity

      # ============================================================
      # 7. Install Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ============================================================
      # 8. Terraform Init
      # ============================================================
      - name: Terraform Init
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        shell: bash
        run: |

          echo "=================================================="
          echo "TERRAFORM INIT"
          echo "=================================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Terraform configuration:"
          ls -la

          echo ""

          terraform init -input=false

      # ============================================================
      # 9. Terraform Plan / Drift Detection
      # ============================================================
      - name: Terraform Drift Check
        id: drift
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        shell: bash
        run: |

          set +e

          echo "=================================================="
          echo "TERRAFORM DRIFT CHECK"
          echo "=================================================="

          echo "Working directory:"
          pwd

          echo ""

          echo "Terraform configuration:"
          ls -la *.tf

          echo ""
          echo "Running terraform plan..."

          terraform plan \
            -detailed-exitcode \
            -no-color \
            > drift-plan.txt 2>&1

          PLAN_EXIT_CODE=$?

          echo ""
          echo "Terraform exit code: $PLAN_EXIT_CODE"

          echo "exit_code=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=================================================="
          echo "TERRAFORM PLAN OUTPUT"
          echo "=================================================="

          cat drift-plan.txt

          echo ""
          echo "=================================================="

          # --------------------------------------------------------
          # EXIT CODE 0
          # No changes
          # --------------------------------------------------------

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then

            echo ""
            echo "NO TERRAFORM DRIFT DETECTED."

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          # --------------------------------------------------------
          # EXIT CODE 1
          # Terraform error
          # --------------------------------------------------------

          if [ "$PLAN_EXIT_CODE" -eq 1 ]; then

            echo ""
            echo "TERRAFORM PLAN FAILED."

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"

            exit 1

          fi

          # --------------------------------------------------------
          # EXIT CODE 2
          # Terraform detected changes
          # --------------------------------------------------------

          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then

            echo ""
            echo "=================================================="
            echo "TERRAFORM DRIFT DETECTED"
            echo "=================================================="

            echo "drift_detected=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          # --------------------------------------------------------
          # Unexpected exit code
          # --------------------------------------------------------

          echo ""
          echo "Unexpected Terraform exit code: $PLAN_EXIT_CODE"

          echo "drift_detected=false" >> "$GITHUB_OUTPUT"

          exit 1

      # ============================================================
      # 10. Display detected drift
      # ============================================================
      - name: Display detected drift
        if: steps.drift.outputs.drift_detected == 'true'
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        shell: bash
        run: |

          echo "=================================================="
          echo "TERRAFORM DRIFT DETECTED"
          echo "=================================================="

          echo ""
          echo "Changed resources:"
          echo "--------------------------------------------------"

          grep -E '^  # .* will be ' drift-plan.txt || true

          echo ""
          echo "Terraform summary:"
          echo "--------------------------------------------------"

          grep -E '^Plan:' drift-plan.txt || true

          echo ""
          echo "Full Terraform plan:"
          echo "--------------------------------------------------"

          cat drift-plan.txt

      # ============================================================
      # 11. Upload Terraform plan
      # ============================================================
      - name: Upload Terraform drift plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-plan
          path: ${{ steps.terraform-location.outputs.terraform_dir }}/drift-plan.txt
          if-no-files-found: warn

      # ============================================================
      # 12. Prepare SES email
      # ============================================================
      - name: Prepare SES email
        if: steps.drift.outputs.drift_detected == 'true'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
          TERRAFORM_DIR: ${{ steps.terraform-location.outputs.terraform_dir }}
        shell: bash
        run: |

          echo "=================================================="
          echo "PREPARING SES EMAIL"
          echo "=================================================="

          python3 <<'PY'
          import json
          import os

          terraform_dir = os.environ["TERRAFORM_DIR"]

          drift_file = os.path.join(
              terraform_dir,
              "drift-plan.txt"
          )

          print("Reading:")
          print(drift_file)

          with open(drift_file, "r") as f:
              plan = f.read()

          request = {
              "Source": os.environ["SES_FROM"],
              "Destination": {
                  "ToAddresses": [
                      os.environ["SES_TO"]
                  ]
              },
              "Message": {
                  "Subject": {
                      "Data": "Terraform Drift Detected"
                  },
                  "Body": {
                      "Text": {
                          "Data": (
                              "Terraform has detected drift "
                              "in your AWS infrastructure.\n\n"
                              "========================================\n"
                              "Terraform Drift Details\n"
                              "========================================\n\n"
                              + plan
                              + "\n\n"
                              "The complete Terraform plan is "
                              "available as a GitHub Actions artifact."
                          )
                      }
                  }
              }
          

          with open(
              "/tmp/ses-request.json",
              "w"
          ) as f:

              json.dump(
                  request,
                  f,
                  indent=2
              )

          print("")
          print("SES request written successfully.")
          print("")
          print("Sender:")
          print(os.environ["SES_FROM"])
          print("")
          print("Recipient:")
          print(os.environ["SES_TO"])
          PY

      # ============================================================
      # 13. Send SES notification
      # ============================================================
      - name: Send SES drift notification
        if: steps.drift.outputs.drift_detected == 'true'
        shell: bash
        run: |

          echo "=================================================="
          echo "SENDING SES DRIFT NOTIFICATION"
          echo "=================================================="

          echo ""
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Sending email..."

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo ""
          echo "=================================================="
          echo "SES EMAIL SENT SUCCESSFULLY"
          echo "=================================================="

      # ============================================================
      # 14. No drift
      # ============================================================
      - name: No drift detected
        if: steps.drift.outputs.drift_detected == 'false'
        run: |

          echo "=================================================="
          echo "NO TERRAFORM DRIFT DETECTED"
          echo "=================================================="

          echo ""
          echo "No SES notification was sent."

      # ============================================================
      # 15. Terraform failure message
      # ============================================================
      - name: Terraform plan failed
        if: failure() && steps.drift.outputs.exit_code == '1'
        run: |

          echo "=================================================="
          echo "TERRAFORM PLAN FAILED"
          echo "=================================================="

          echo ""
          echo "Review the Terraform Drift Check step above."

