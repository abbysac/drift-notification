name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout drift-notification repository
      # =========================================================
      - name: Checkout drift notification repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Checkout public drift-detection repository
      # =========================================================
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: abbysac/drift-detection
          ref: main
          path: infrastructure

      # =========================================================
      # 3. Find Terraform configuration
      # =========================================================
      - name: Locate Terraform configuration
        id: terraform-location
        shell: bash
        run: |
          echo "========================================"
          echo "Current directory"
          echo "========================================"
          pwd

          echo ""
          echo "========================================"
          echo "Infrastructure repository"
          echo "========================================"
          find infrastructure -maxdepth 3 -type f -print | sort

          echo ""
          echo "========================================"
          echo "Searching for Terraform files"
          echo "========================================"

          TF_FILES=$(find infrastructure -type f -name "*.tf" -print)

          if [ -z "$TF_FILES" ]; then
            echo ""
            echo "ERROR: No Terraform .tf files found."
            echo ""
            echo "Repository contents:"
            find infrastructure -type f -print | sort
            exit 1
          fi

          echo "$TF_FILES"

          echo ""
          echo "========================================"
          echo "Determining Terraform directory"
          echo "========================================"

          # Get directory containing the first Terraform file
          FIRST_TF_FILE=$(echo "$TF_FILES" | head -n 1)

          TF_DIR=$(dirname "$FIRST_TF_FILE")

          echo "First Terraform file:"
          echo "$FIRST_TF_FILE"

          echo ""
          echo "Terraform directory:"
          echo "$TF_DIR"

          # Make the path relative to the GitHub workspace
          TF_DIR="${TF_DIR#./}"

          echo ""
          echo "Final Terraform working directory:"
          echo "$TF_DIR"

          echo "terraform_dir=$TF_DIR" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 4. Show Terraform directory
      # =========================================================
      - name: Verify Terraform directory
        run: |
          echo "Terraform working directory:"
          echo "${{ steps.terraform-location.outputs.terraform_dir }}"

          echo ""
          echo "Contents:"
          ls -la "${{ steps.terraform-location.outputs.terraform_dir }}"

          echo ""
          echo "Terraform files:"
          find "${{ steps.terraform-location.outputs.terraform_dir }}" \
            -maxdepth 1 \
            -type f \
            -name "*.tf" \
            -print

      # =========================================================
      # 5. Configure AWS OIDC
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # =========================================================
      # 6. Verify AWS identity
      # =========================================================
      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # =========================================================
      # 7. Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================================================
      # 8. Terraform Init
      # =========================================================
      - name: Terraform Init
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        run: |
          echo "Running Terraform Init in:"
          pwd

          terraform init -input=false

      # =========================================================
      # 9. Terraform Plan / Drift Detection
      # =========================================================
      - name: Terraform Plan
        id: drift
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Terraform Working Directory"
          echo "========================================"

          pwd

          echo ""
          echo "Terraform configuration:"
          ls -la *.tf

          echo ""
          echo "========================================"
          echo "Terraform Plan"
          echo "========================================"

          terraform plan \
            -detailed-exitcode \
            -no-color \
            > drift-plan.txt 2>&1

          PLAN_EXIT_CODE=$?

          echo ""
          echo "Terraform exit code: $PLAN_EXIT_CODE"

          echo "exit_code=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "Terraform Plan Output"
          echo "========================================"

          cat drift-plan.txt

          echo ""
          echo "========================================"

          # -------------------------------------------------------
          # Terraform error
          # -------------------------------------------------------
          if [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Terraform plan failed."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # -------------------------------------------------------
          # Terraform detected changes
          # -------------------------------------------------------
          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform drift detected."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -------------------------------------------------------
          # No changes
          # -------------------------------------------------------
          echo "No Terraform drift detected."

          echo "drift_detected=false" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 10. Display drift
      # =========================================================
      - name: Display detected drift
        if: steps.drift.outputs.drift_detected == 'true'
        working-directory: ${{ steps.terraform-location.outputs.terraform_dir }}
        run: |
          echo "========================================"
          echo "TERRAFORM DRIFT DETECTED"
          echo "========================================"

          echo ""
          echo "Changed resources:"
          echo "----------------------------------------"

          grep -E '^  # .* will be ' drift-plan.txt || true

          echo ""
          echo "Terraform Plan Summary:"
          echo "----------------------------------------"

          grep -E '^Plan:' drift-plan.txt || true

          echo ""
          echo "Full Terraform Plan:"
          echo "----------------------------------------"

          cat drift-plan.txt

      # =========================================================
      # 11. Upload drift plan
      # =========================================================
      - name: Upload Terraform drift plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-plan
          path: ${{ steps.terraform-location.outputs.terraform_dir }}/drift-plan.txt
          if-no-files-found: warn

      # =========================================================
      # 12. Prepare SES email
      # =========================================================
      - name: Prepare SES email
        if: steps.drift.outputs.drift_detected == 'true'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
          TERRAFORM_DIR: ${{ steps.terraform-location.outputs.terraform_dir }}
        run: |
          echo "========================================"
          echo "Preparing SES email"
          echo "========================================"

          python3 <<'PY'
          import json
          import os

          terraform_dir = os.environ["TERRAFORM_DIR"]
          drift_file = os.path.join(terraform_dir, "drift-plan.txt")

          print(f"Reading drift plan: {drift_file}")

          with open(drift_file, "r") as f:
              plan = f.read()

          request = {
              "Source": os.environ["SES_FROM"],
              "Destination": {
                  "ToAddresses": [
                      os.environ["SES_TO"]
                  ]
              },
              "Message": {
                  "Subject": {
                      "Data": "Terraform Drift Detected"
                  },
                  "Body": {
                      "Text": {
                          "Data": (
                              "Terraform has detected drift in your AWS infrastructure.\n\n"
                              "========================================\n"
                              "Terraform Drift Details\n"
                              "========================================\n\n"
                              + plan
                              + "\n\n"
                              "The complete Terraform plan is available "
                              "in the GitHub Actions artifact."
                          )
                      }
                  }
              }
          }

          with open("/tmp/ses-request.json", "w") as f:
              json.dump(request, f, indent=2)

          print("SES request written successfully.")
          PY

      # =========================================================
      # 13. Send SES email
      # =========================================================
      - name: Send SES drift notification
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "========================================"
          echo "Sending SES drift notification"
          echo "========================================"

          echo ""
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Sending email..."

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo ""
          echo "========================================"
          echo "SES EMAIL SENT SUCCESSFULLY"
          echo "========================================"

      # =========================================================
      # 14. No drift
      # =========================================================
      - name: No drift detected
        if: steps.drift.outputs.drift_detected == 'false'
        run: |
          echo "========================================"
          echo "NO TERRAFORM DRIFT DETECTED"
          echo "========================================"

          echo "No SES notification was sent."

      # =========================================================
      # 15. Terraform failure
      # =========================================================
      - name: Terraform plan failed
        if: failure() && steps.drift.outputs.exit_code == '1'
        run: |
          echo "========================================"
          echo "TERRAFORM PLAN FAILED"
          echo "========================================"

          echo "Check the Terraform Plan output above."

