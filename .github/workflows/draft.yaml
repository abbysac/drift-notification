name: Terraform Drift Detection

on:
  workflow_dispatch:

  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout the drift-notification repository
      # ---------------------------------------------------------
      - name: Checkout drift notification repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Checkout the infrastructure/Terraform repository
      # ---------------------------------------------------------
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: abbysac/drift-detection
          ref: main
          path: terraform
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Configure AWS credentials using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # ---------------------------------------------------------
      # 4. Verify AWS authentication
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # 5. Install Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # 6. Initialize Terraform
      # ---------------------------------------------------------
      - name: Terraform Init
        working-directory: abbysac/drift-notification
        run: |
          terraform init -input=false

      # ---------------------------------------------------------
      # 7. Run Terraform plan
      # ---------------------------------------------------------
    
      - name: Terraform Plan
        id: drift
        working-directory: terraform
        shell: bash
        run: |
            set +e

            terraform plan \
            -detailed-exitcode \
            -no-color \
            > drift-plan.txt 2>&1

            PLAN_EXIT_CODE=$?

            echo "Terraform exit code: $PLAN_EXIT_CODE"

            echo "exit_code=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

            echo ""
            echo "========== TERRAFORM PLAN =========="
            cat drift-plan.txt
            echo "===================================="
            echo ""

            # Terraform exit code 1 = error
            if [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Terraform plan failed."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            exit 1
            fi

            # Terraform exit code 2 normally means changes were detected.
            if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform reported changes."

            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
            fi

            # Some configurations may return 0 while the plan summary
            # still indicates changes, so check the Plan summary too.
            if grep -Eq '^Plan: [1-9][0-9]* to add|^Plan: [0-9]+ to change|^Plan: [0-9]+ to destroy' drift-plan.txt; then
            echo "Terraform plan contains changes."

            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            exit 0
            fi

            echo "No Terraform drift detected."

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
        

            # ---------------------------------------------------------
            # 8. Display detected drift
            # ---------------------------------------------------------
            - name: Display detected drift
                if: steps.drift.outputs.drift_detected == 'true'
                run: |
                echo "========================================="
                echo "Terraform Drift Detected"
                echo "========================================="

                echo ""
                echo "Changed resources:"
                echo "-----------------------------------------"

                grep -E '^  # .* will be ' terraform/drift-plan.txt || true

                echo ""
                echo "Terraform Plan Summary:"
                echo "-----------------------------------------"

                grep -E '^Plan:' terraform/drift-plan.txt || true

                echo ""
                echo "Full Terraform Plan:"
                echo "-----------------------------------------"

                cat terraform/drift-plan.txt

            # ---------------------------------------------------------
            # 9. Upload the Terraform drift plan
            # ---------------------------------------------------------
            - name: Upload Terraform drift plan
                if: always()
                uses: actions/upload-artifact@v4
                with:
                name: terraform-drift-plan
                path: terraform/drift-plan.txt
                if-no-files-found: warn

            # ---------------------------------------------------------
            # 10. Prepare SES email
            # ---------------------------------------------------------
            - name: Prepare SES email
                if: steps.drift.outputs.drift_detected == 'true'
                env:
                SES_FROM: "abbysac@gmail.com"
                SES_TO: "camleous@yahoo.com"
                run: |
                python3 <<'PY'
                import json
                import os

                drift_file = "terraform/drift-plan.txt"

                try:
                    with open(drift_file, "r") as f:
                        plan = f.read()
                except FileNotFoundError:
                    plan = (
                        "Terraform drift was detected, "
                        "but the drift plan file could not be found."
                    )

                request = {
                    "Source": os.environ["SES_FROM"],
                    "Destination": {
                        "ToAddresses": [
                            os.environ["SES_TO"]
                        ]
                    },
                    "Message": {
                        "Subject": {
                            "Data": "Terraform Drift Detected"
                        },
                        "Body": {
                            "Text": {
                                "Data": (
                                    "Terraform has detected drift in your AWS "
                                    "infrastructure.\n\n"
                                    "Detected changes:\n\n"
                                    + plan
                                    + "\n\n"
                                    "Review the Terraform plan artifact in GitHub Actions."
                                )
                            }
                        }
                    }
                }

                with open("/tmp/ses-request.json", "w") as f:
                    json.dump(request, f, indent=2)

                print("SES request written to /tmp/ses-request.json successfully.")
                PY

      # ---------------------------------------------------------
      # 11. Send SES notification
      # ---------------------------------------------------------
      - name: Send SES drift notification
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "Sending Terraform drift notification..."

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo "SES email sent successfully."

      # ---------------------------------------------------------
      # 12. No drift message
      # ---------------------------------------------------------
      - name: No drift detected
        if: steps.drift.outputs.drift_detected == 'false'
        run: |
          echo "========================================="
          echo "No Terraform drift detected."
          echo "========================================="

      # ---------------------------------------------------------
      # 13. Terraform failure message
      # ---------------------------------------------------------
      - name: Terraform plan failed
        if: failure() && steps.drift.outputs.exit_code == '1'
        run: |
          echo "========================================="
          echo "Terraform plan failed."
          echo "Check the Terraform plan output above."
          echo "========================================="
